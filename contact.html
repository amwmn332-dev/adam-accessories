<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا - إكسسوار آدم</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contact-card {
      width: 85%;
      max-width: 650px;
      margin: 60px auto;
      background: rgba(255, 255, 255, 0.92);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    .contact-card h1 {
      color: #00bcd4;
      font-size: 36px;
      margin-bottom: 15px;
    }
    .contact-card p {
      font-size: 18px;
      color: #444;
      margin-bottom: 30px;
    }
    .contact-btns {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .c-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .whatsapp { background-color: #25D366; }
    .whatsapp:hover { background-color: #1da851; transform: translateY(-3px); }
    
    .phone { background-color: #00bcd4; }
    .phone:hover { background-color: #0097a7; transform: translateY(-3px); }

    .facebook { background-color: #1877F2; }
    .facebook:hover { background-color: #115cbe; transform: translateY(-3px); }
  </style>
</head>

  </nav>

</body>
